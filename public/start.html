<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Narrativa - Start</title>
  <link rel="stylesheet" href="start.css" />
</head>
<body>
  <div class="container">
    <div class="dialogue">
      <img src="images/dialogue1.png" alt="Dialogue Background" />
    </div>

    <img src="images/thisisyoutext.png" alt="This is you" class="title-image" />
    <img src="images/character1.png" alt="Character" class="character" />

    
      <img src="images/approachbutton.png" alt="Approach Button" class="approach-button"  />

  </div>
  <!-- Fade overlay -->
<div id="fade-overlay" style="opacity: 1;"></div>

<script>
  document.querySelector(".approach-button").addEventListener("click", () => {
    const overlay = document.getElementById("fade-overlay");
    overlay.classList.add("fade-out");
    overlay.style.opacity = "1";
    setTimeout(() => {
      window.location.href = "opening.html"; // Replace with your actual next page
    }, 500); // Match the animation duration (1s)
  });
</script>
<script>
  window.addEventListener("load", () => {
    const overlay = document.getElementById("fade-overlay");
    overlay.style.transition = "opacity 0.5s ease";
    overlay.style.opacity = 0;
  });
</script>
</body>
</html>
