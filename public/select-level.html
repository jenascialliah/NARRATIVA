<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Narrativa - Select Level</title>
  <link rel="stylesheet" href="select.css" />
</head>

<body>
  <div class="container">
    <!-- Select level dialogue -->
    <img src="images/level_dialogue (1).png" alt="Select a level" class="level-dialogue">

    <!-- Chapter 1 book image -->
    <div class="book-wrapper">
      <img src="images/chap1_book.png" alt="Chapter 1 Book" class="book-image">

      <!-- Buttons layered on top -->
      <div class="buttons">
        <img src="images/prologue_btn.png" class="level-btn" alt="Prologue" onclick=" goToMenu()" >
        <img src="images/first_pg_btn.png" class="level-btn" alt="First Page"onclick=" goToMenu1()">
        <img src="images/second_pg_btn.png" class="level-btn" alt="Second Page"onclick=" goToMenu2()">
        <img src="images/third_pg_btn.png" class="level-btn" alt="Third Page"onclick=" goToMenu3()">
        <img src="images/fourth_pg_btn.png" class="level-btn" alt="Fourth Page"onclick=" goToMenu4()">
      </div>
    </div>
  </div>
      <!-- Fade overlay -->
<div id="fade-overlay" class="fade-overlay"></div>

<script>
  function goToMenu() {
  const fade = document.getElementById('fade-overlay');
  fade.classList.add('active');
  setTimeout(() => {
    window.location.href = 'prologue.html';
  }, 1000);
}
</script>
<script>
  function goToMenu1() {
  const fade = document.getElementById('fade-overlay');
  fade.classList.add('active');
  setTimeout(() => {
    window.location.href = 'first_page.html';
  }, 1000);
}
</script>
<script>
  function goToMenu2() {
  const fade = document.getElementById('fade-overlay');
  fade.classList.add('active');
  setTimeout(() => {
    window.location.href = 'second_page.html';
  }, 1000);
}
</script>
<script>
  function goToMenu3() {
  const fade = document.getElementById('fade-overlay');
  fade.classList.add('active');
  setTimeout(() => {
    window.location.href = 'third_page.html';
  }, 1000);
}
</script>
<script>
  function goToMenu4() {
  const fade = document.getElementById('fade-overlay');
  fade.classList.add('active');
  setTimeout(() => {
    window.location.href = 'fourth_page.html';
  }, 1000);
}
</script>
<style>
    .fade-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: black;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s ease;
  z-index: 9999;
}

.fade-overlay.active {
  opacity: 1;
  pointer-events: all;
}

  </style>
  
</body>
</html>
