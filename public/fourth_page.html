<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Narrativa - Fourth Page</title>
  <link rel="stylesheet" href="prologue.css" />
  <style>
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal-bg img {
      width: 200px;
      cursor: pointer;
      margin: 0 20px;
      transition: transform 0.2s ease;
    }
    .modal-bg img:hover {
      transform: scale(1.1);
    }
    .story-board2 {
       display: grid;
  grid-template-columns: repeat(3, 1fr); /* 3 columns */
  gap: 5px; /* Reduce space between cells */
  justify-items: center;
  padding: 10px 280px;
  margin-top: -35px;
  margin-left: -105px;
    }
    .story-cell2 {
      position: relative;
      width: 200px;
    }
    .story-cell2 img.character {
      position: absolute;
      bottom: 0;
      width: 100px;
      z-index: 5;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <img src="images/backtochap1_btn.png" alt="Back" onclick="goToChapter()" />
    <img src="images/hint_btn.png" alt="Hint" onclick="goToMenu()" />
  </div>
  <div class="title">
    <img src="images/fourth_dialogue.png" alt="Fourth Page Dialogue" style="margin-top: -40px;"/>
  </div>
  <div class="story-board2">
    <div class="story-cell2" id="story1"><img src="images/story_board_bg.png" /><img class="delete-btn" src="images/delete_btn.png" style="left: -30px; top: 120px;" /></div>
    <div class="story-cell2" id="story2"><img src="images/story_board_bg.png" /><img class="delete-btn" src="images/delete_btn.png" style="left: -30px; top: 120px;"/></div>
    <div class="story-cell2" id="story3"><img src="images/story_board_bg.png" /><img class="delete-btn" src="images/delete_btn.png" style="left: -30px; top: 120px;"/></div>
    <div class="story-cell2" id="story4"><img src="images/story_board_bg.png" /><img class="delete-btn" src="images/delete_btn.png" style="left: -30px; top: 120px;"/></div>
    <div class="story-cell2" id="story5"><img src="images/story_board_bg.png"/><img class="delete-btn" src="images/delete_btn.png" style="left: -30px; top: 120px;"/></div>
    <div class="story-cell2" id="story6"><img src="images/story_board_bg.png" /><img class="delete-btn" src="images/delete_btn.png" style="left: -30px; top: 120px;"/></div>
  </div>

  <div class="bottom-section">
    <div class="left-box">
      <img class="bg" src="images/rectangle_castle_fight_.png" />
      <div class="icon-btns1" style="left: 10px; gap: 0px;">
        <img id="poisonBtn" src="images/poison_btn.png" />
        <img id="deathBtn" src="images/death_btn.png" />
        <img id="sleepBtn" src="images/sleep_btn.png" />
        <img id="wakeupBtn" src="images/wakeup_btn.png" />
      </div>
    </div>
    <div class="right-box">
      <img class="bg" src="images/rectangle_castle_fight_.png" />
      <div class="char-btns1" style="left: 135px; top: 30px;">
        <img src="images/juliet_head.png" onclick="openModal('juliet')" />
        <img src="images/romeo_head.png" onclick="openModal('romeo')" />
      </div>
    </div>
  </div>

  <div class="footer-btns">
    <img src="images/clear_btn.png" onclick="clearStoryBoard()" />
    <img src="images/check_btn.png" onclick="checkStoryBoard()" />
  </div>

  <div id="julietModal" class="modal-bg">
    <img src="images/juliet_sad2.png" onclick="selectCharacter('images/juliet_sad2.png', 'julietModal')" />
    <img src="images/juliet_awake.png" onclick="selectCharacter('images/juliet_awake.png', 'julietModal')" />
    <img src="images/juliet_sleeping.png" onclick="selectCharacter('images/juliet_sleeping.png', 'julietModal')" />
    <img src="images/juliet_dead.png" onclick="selectCharacter('images/juliet_dead.png', 'julietModal')" />
  </div>

  <div id="romeoModal" class="modal-bg">
    <img src="images/romeo_shock2.png" onclick="selectCharacter('images/romeo_shock2.png', 'romeoModal')" />
    <img src="images/romeo_dead.png" onclick="selectCharacter('images/romeo_dead.png', 'romeoModal')" />
    <img src="images/romeo_dead_headonly.png" onclick="selectCharacter('images/romeo_dead_headonly.png', 'romeoModal')" />
  </div>

  <script>
    let selectedCastle = null;
    let selectedCharacter = null;

    const backgrounds = {
      poison: "images/poison_bg.png",
      death: "images/coffin_bg.png",
      sleep: "images/sleep_bg.png",
      wake: "images/wake_bg.png"
    };

    document.getElementById("poisonBtn").onclick = () => { selectedCastle = backgrounds.poison; selectedCharacter = null; };
    document.getElementById("deathBtn").onclick = () => { selectedCastle = backgrounds.death; selectedCharacter = null; };
    document.getElementById("sleepBtn").onclick = () => { selectedCastle = backgrounds.sleep; selectedCharacter = null; };
    document.getElementById("wakeupBtn").onclick = () => { selectedCastle = backgrounds.wake; selectedCharacter = null; };

    function openModal(character) {
      document.getElementById(`${character}Modal`).style.display = "flex";
    }

    function selectCharacter(imagePath, modalId) {
      selectedCharacter = imagePath;
      selectedCastle = null;
      document.getElementById(modalId).style.display = "none";
    }

    function clearStoryBoard() {
      selectedCastle = null;
      selectedCharacter = null;
      document.querySelectorAll(".story-cell2").forEach(cell => {
        const bgImg = cell.querySelector('img:not(.delete-btn):not(.character)');
        if (bgImg) { bgImg.src = "images/story_board_bg.png"; bgImg.style.width = ""; bgImg.style.height = "auto"; }
        cell.querySelectorAll("img.character").forEach(c => c.remove());
      });
    }

    function checkStoryBoard() {
      const expected = [
        { bg: "sleep_bg.png", chars: ["juliet_sad2.png"] },
        { bg: "coffin_bg.png", chars: ["romeo_shock2.png", "juliet_sleeping.png"] },
        { bg: "poison_bg.png", chars: ["romeo_dead.png"] },
        { bg: "wake_bg.png", chars: ["juliet_awake.png"] },
        { bg: "coffin_bg.png", chars: ["juliet_sad2.png", "romeo_dead_headonly.png"] },
        { bg: "poison_bg.png", chars: ["juliet_dead.png"] }
      ];

      const cells = document.querySelectorAll(".story-cell2");
      let isCorrect = true;

      cells.forEach((cell, index) => {
        const bg = cell.querySelector('img:not(.delete-btn):not(.character)').src.split("/").pop();
        const characters = Array.from(cell.querySelectorAll("img.character")).map(img => img.src.split("/").pop());
        const expectedChars = expected[index].chars;

        if (!bg.includes(expected[index].bg) ||
            characters.length !== expectedChars.length ||
            !expectedChars.every(c => characters.includes(c))) {
          isCorrect = false;
        }
      });

      window.location.href = isCorrect ? "completed_fourthpage.html" : "incorrect5.html";
    }

    function applyStoryCellEvents() {
      document.querySelectorAll(".story-cell2").forEach(cell => {
        const mainImg = cell.querySelector('img:not(.delete-btn):not(.character)');
        const deleteBtn = cell.querySelector(".delete-btn");

       cell.onclick = function () {
  if (selectedCastle && mainImg) {
    mainImg.src = selectedCastle;
    mainImg.style.width = "270px"; // match background size
    selectedCastle = null;
  }

  if (selectedCharacter) {
    const img = document.createElement("img");
    img.src = selectedCharacter;
    img.classList.add("character");

    const filename = selectedCharacter.split("/").pop();
    const id = cell.id;

    img.style.position = "absolute";
    img.style.width = ["romeo_dead.png", "juliet_dead.png"].includes(filename) ? "100px" : "80px";
    img.style.transform = "translateX(-50%)";
    img.style.zIndex = "5";

    // Special exceptions: top placement
    if (filename === "juliet_sleeping.png" || filename === "romeo_dead_headonly.png") {
      img.style.top = "60px";
      img.style.left = "80%";
      img.style.bottom = "auto";
    } else {
      // Position per storyboard
      switch (id) {
        case "story1":
          img.style.left = "100%";
          img.style.bottom = "10px";
          break;
        case "story2":
        case "story5":
          img.style.left = "40%";
          img.style.bottom = "10px";
          break;
        case "story4":
          img.style.left = "67%";
          img.style.bottom = "10px";
          img.style.width = "100px";
          break;
        case "story3":
        case "story6":
          img.style.left = "70%";
          img.style.bottom = "10px";
          break;
      }
    }

    cell.appendChild(img);
    selectedCharacter = null;
  }
};

        deleteBtn.onclick = function (e) {
  e.stopPropagation();

  if (mainImg) {
    mainImg.src = "images/story_board_bg.png";
    mainImg.style.width = ""; // or your desired width like "200px"
    mainImg.style.height = "auto"; // maintain aspect ratio
  }

  cell.querySelectorAll("img.character").forEach(c => c.remove());
};
      });
    }

    function goToChapter() {
      window.location.href = "select-level.html";
    }

    function goToHint() {
      window.location.href = "hint5.html";
    }

    document.addEventListener("DOMContentLoaded", applyStoryCellEvents);
  </script>
        <!-- Fade overlay -->
<div id="fade-overlay" class="fade-overlay"></div>

<script>
  function goToMenu() {
  const fade = document.getElementById('fade-overlay');
  fade.classList.add('active');
  setTimeout(() => {
    window.location.href = 'hint5.html';
  }, 1000);
}
</script>
<style>
    .fade-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: black;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s ease;
  z-index: 9999;
}

.fade-overlay.active {
  opacity: 1;
  pointer-events: all;
}

  </style>
</body>
</html>
