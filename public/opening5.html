<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Narrativa Opening</title>
  <link rel="stylesheet" href="opening.css">
  <style>
    /* Fixing the fade-out overlay */
    .fade-out {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
      z-index: 9999; /* Must be higher than all other content */
    }
    .fade-out.active {
      opacity: 1;
      pointer-events: all;
    }
  </style>
</head>
<body>
  <div class="background">
    <!-- Mysterious character's dialogue section -->
    <div class="dialogue-box">
      <img src="images/nyxa.png" alt="mysterious" class="mysterious">
      <img src="images/orange_rectangle.png" alt="dialogue background" class="dialogue-bg">
      <img src="images/nyxa_dialogue.png" alt="question mark" class="question-icon">
      <img src="images/long_dialogue5.png" alt="long dialogue" class="long-dialogue">
    </div>

    <!-- Click to proceed button -->
    <img src="images/start_a_story.png" alt="click to proceed" class="start-a-story" onclick="goToMenu()">
 
    <!-- Main character (YOU) section -->
    <div class="player-section">
      <div class="dialogue-labels">
        <img src="images/you_dialogue.png" alt="you label" class="you-label">
        <img src="images/orange_listening.png" alt="listening" class="listening-text">
      </div>
      <img src="images/character2.png" alt="you" class="you-character">
    </div>
  </div>

  <!-- Fade overlay -->
<div id="fade-overlay"></div>

<script>
  function goToMenu() {
    const fade = document.getElementById('fade-overlay');
    fade.classList.add('fade-out');
    setTimeout(() => {
      window.location.href = 'select-level.html';
    }, 1000);
  }
</script>
</body>
</html>
