<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Narrativa - Sign the book</title>
  <link rel="stylesheet" href="sign.css" />
  <style>
    .fade-out {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
      z-index: 999;
    }

    .fade-out.active {
      opacity: 1;
      pointer-events: all;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .book-img {
      width: 900px;
      margin-bottom: 0px;
    }

    .sign-btn {
      width: 250px;
      top: 700px;
      cursor: pointer;
      transition: transform 0.2s ease;
      z-index: 99;
    }

    .sign-btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="images/closed_book.png" alt="Closed Book" class="book-img" />
    <img src="images/sign_the_book_btn.png" alt="Sign the Book" class="sign-btn" onclick="goToPorlogue()" />
  </div>

  <div class="fade-out" id="fade"></div>

  <script>
    function goToPorlogue() {
      // Optional: add fade out effect
      const fade = document.getElementById("fade");
      fade.classList.add("active");
      setTimeout(() => {
        window.location.href = 'ending.html';
      }, 1000); // match this with transition in .fade-out
    }
  </script>
</body>
</html>
